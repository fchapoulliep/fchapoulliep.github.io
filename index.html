<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Florian Chapoullié-Pino</title>

    <!-- Proves to Google Search Console that the whole fchapoulliep.github.io domain is mine -->
    <meta name="google-site-verification" content="xJBDW7QGBJ91iklZu2RWSRQztWcXCL3t-QnV8VSh4oA" />

    <!-- The domain root has no content of its own: visitors and search engines go to the portfolio -->
    <link rel="canonical" href="https://fchapoulliep.github.io/portfolio/" />
    <meta http-equiv="refresh" content="0; url=https://fchapoulliep.github.io/portfolio/" />

    <!--
      Google shows one favicon and one site name per hostname, read from this root page,
      above the results of every site of the domain. Pages under /portfolio/ or /dragondex3d/
      cannot set their own. The PNG is there because Google wants an icon larger than 48 px.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta property="og:site_name" content="Florian Chapoullié-Pino" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Florian Chapoullié-Pino",
        "alternateName": "fchapoulliep.github.io",
        "url": "https://fchapoulliep.github.io/"
      }
    </script>

    <meta name="theme-color" content="#121212" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121212;
        color: #f5f5f5;
        font: 16px/1.6 system-ui, sans-serif;
      }
      a {
        color: inherit;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #fafafa;
          color: #171717;
        }
      }
    </style>
  </head>
  <body>
    <p><a href="https://fchapoulliep.github.io/portfolio/">Florian Chapoullié-Pino's portfolio</a></p>
  </body>
</html>
