<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Meta tags -->
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/logos/icon-192.png" type="image/png" sizes="192x192" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser's bar takes the color of the theme shown (set below and by the toggle) -->
    <meta name="theme-color" content="#121212" />

    <!--
      Theme set before the first paint: dark, unless the visitor chose light
      with the toggle. The system's theme is not followed (Florian, 2026-11-06).
    -->
    <script>
      (function () {
        var dark = true;
        try {
          dark = localStorage.getItem("theme") !== "light";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        if (!dark) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#fafafa");
        }
      })();
    </script>

    <!-- Fonts of the design system: Comfortaa for the titles, Nunito for the text -->
